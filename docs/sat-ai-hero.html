<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sat-ai · Before and after</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1360px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 1280 696" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sat-ai-hero-title sat-ai-hero-desc">
        <title id="sat-ai-hero-title">sat-ai · from "no availability" to a booked appointment</title>
        <desc id="sat-ai-hero-desc">Three beats, left to right: the SAT citas site answers that there is no availability, sat-ai repeats the check every hour, and when a slot opens the appointment is booked and a notification reaches your phone.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Header -->
        <text x="72" y="76" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SAT-AI · APPOINTMENTS AT MEXICO'S TAX AUTHORITY</text>
        <text fill="#2d3142" font-size="46" font-family="'Instrument Serif', serif" letter-spacing="-0.02em">
          <tspan x="72" y="132">Checks every hour for a SAT appointment,</tspan>
          <tspan x="72" y="182">and books it when one opens.</tspan>
        </text>
        <text fill="#4f5d75" font-size="18" font-family="'Geist', sans-serif">
          <tspan x="72" y="226">The booking site almost never has an open slot. sat-ai fills in the form,</tspan>
          <tspan x="72" y="252">reads the CAPTCHA and alerts your phone when one appears.</tspan>
        </text>

        <g transform="translate(0,232)">

        <!-- Arrows first -->
        <line x1="424" y1="204" x2="544" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="736" y1="204" x2="920" y2="204" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <rect x="436" y="178" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="484" y="190" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK AGAIN</text>

        <rect x="776" y="178" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="828" y="190" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">A SLOT OPENS</text>

        <!-- Beat 1: the site's "no availability" dialog -->
        <rect x="72" y="96" width="336" height="216" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <text x="96" y="136" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AVISO IMPORTANTE</text>
        <line x1="96" y1="152" x2="384" y2="152" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text fill="#2d3142" font-size="16" font-family="'Geist', sans-serif">
          <tspan x="96" y="184">No se cuenta con disponibilidad</tspan>
          <tspan x="96" y="208">para el servicio y módulo</tspan>
          <tspan x="96" y="232">seleccionado.</tspan>
        </text>
        <rect x="296" y="260" width="88" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="340" y="281" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Aceptar</text>

        <!-- Beat 2: the hourly loop (focal) -->
        <circle cx="640" cy="204" r="80" fill="rgba(235,108,54,0.08)"/>
        <path d="M 680 134.72 A 80 80 0 1 1 626.11 125.22" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <text x="640" y="214" fill="#2d3142" font-size="30" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">every hour</text>

        <!-- Beat 3: the phone alert -->
        <rect x="936" y="56" width="208" height="288" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <line x1="1016" y1="76" x2="1064" y2="76" stroke="rgba(45,49,66,0.30)" stroke-width="3" stroke-linecap="round"/>
        <rect x="948" y="120" width="184" height="96" rx="10" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="960" y="134" width="16" height="16" rx="4" fill="#2d3142"/>
        <text x="984" y="147" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Cita SAT agendada</text>
        <text x="960" y="174" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif">15 oct 2026, 10:30</text>
        <text x="960" y="196" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Oficina Virtual</text>
        <line x1="1008" y1="324" x2="1072" y2="324" stroke="rgba(45,49,66,0.30)" stroke-width="3" stroke-linecap="round"/>

        <!-- Beat captions -->
        <text x="240" y="396" fill="#2d3142" font-size="22" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No availability</text>
        <text x="240" y="420" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WHAT THE SITE ANSWERS</text>

        <text x="640" y="396" fill="#2d3142" font-size="22" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sat-ai checks again</text>
        <text x="640" y="420" fill="#eb6c36" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FORM · CAPTCHA · CALENDAR</text>

        <text x="1040" y="396" fill="#2d3142" font-size="22" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Booked</text>
        <text x="1040" y="420" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AND YOUR PHONE TELLS YOU</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
